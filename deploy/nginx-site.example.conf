# Si el servidor ya tiene nginx sirviendo www.bingohit.cl, añade esto dentro de su
# bloque "server { ... }" (el de HTTPS) y arranca el sistema con:
#     docker compose --profile concert up -d --build     # publica el servidor en 127.0.0.1:3010
#
# Con Apache el equivalente sería (a2enmod proxy proxy_http proxy_wstunnel rewrite):
#     RedirectMatch 301 ^/sistema$ /sistema/
#     RewriteEngine On
#     RewriteCond %{HTTP:Upgrade} websocket [NC]
#     RewriteRule ^/sistema/(.*) ws://127.0.0.1:3010/$1 [P,L]
#     ProxyPass        /sistema/ http://127.0.0.1:3010/
#     ProxyPassReverse /sistema/ http://127.0.0.1:3010/

# Raíz del dominio: página de presentación (public/home) con el botón "Ingresar" al sistema.
# En un proxy nginx en Docker sustituye 127.0.0.1:3010 por el nombre del contenedor (music-bingo-concert-1:3010).
location / {
    proxy_pass http://127.0.0.1:3010/home/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /sistema {
    return 301 /sistema/;
}

location /sistema/ {
    proxy_pass http://127.0.0.1:3010/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
