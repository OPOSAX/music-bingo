name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Marcar la versión y evitar cachés antiguas
        run: |
          v="${GITHUB_SHA::7}"
          echo "$v" > public/version.txt
          sed -i "s#js/main.js#js/main.js?v=$v#; s#styles.css#styles.css?v=$v#" public/index.html
          # Los módulos importados desde main.js no llevan ?v: se sirven con revalidación (max-age corto de Pages).
      - name: Activar GitHub Pages si hace falta
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
