name: Desplegar en el servidor

# Se conecta por SSH al servidor y reconstruye el contenedor.
# Secretos necesarios en el repositorio (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      IP o dominio del servidor (OVH)
#   DEPLOY_USER      usuario SSH con permiso para usar Docker
#   DEPLOY_SSH_KEY   clave privada SSH (formato OpenSSH) cuya pública está en ~/.ssh/authorized_keys del servidor
#   DEPLOY_PATH      ruta del clon en el servidor, p. ej. /opt/music-bingo
# Variable opcional (Settings → Variables):
#   DEPLOY_PROFILE   perfil de Compose a usar, p. ej. "https" (por defecto ninguno)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Preparar clave SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Actualizar y reconstruir el contenedor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROFILE: ${{ vars.DEPLOY_PROFILE }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "set -e; cd '$DEPLOY_PATH'; git fetch origin main; git reset --hard origin/main; \
             if [ -n '$PROFILE' ]; then docker compose --profile '$PROFILE' up -d --build --remove-orphans; \
             else docker compose up -d --build --remove-orphans; fi; \
             docker image prune -f >/dev/null"
