# Bingo musical · Docker Compose
#
#   Producción (HTTP en 127.0.0.1:APP_PORT, detrás de tu propio nginx/Apache/proxy):
#     docker compose up -d --build
#
#   Producción con HTTPS automático (Caddy + Let's Encrypt, https://www.bingohit.cl/sistema/,
#   ver docker/Caddyfile; necesita los puertos 80/443 libres en el servidor):
#     docker compose --profile https up -d --build
#
#   Desarrollo (recompila al guardar, http://127.0.0.1:8888/):
#     docker compose --profile dev up
#
#   Karaoke / modo concierto (app + señalización + SFU mediasoup en http://IP:3010/, ver docs/CONCERT_MODE.md):
#     BTALK_ANNOUNCED_IP=<ip pública o LAN> CONCERT_DJ_TOKEN=<secreto> docker compose --profile concert up -d --build

services:
  app:
    build:
      context: .
      target: runtime
    image: music-bingo:latest
    restart: unless-stopped
    ports:
      # Solo accesible desde el propio servidor (Caddy o tu proxy inverso la exponen).
      - "127.0.0.1:${APP_PORT:-8080}:80"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - concert
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  concert:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: music-bingo-concert:latest
    # "concert": solo el servidor (detrás de tu propio nginx/Apache). "https": con Caddy delante.
    profiles: ["concert", "https"]
    restart: unless-stopped
    environment:
      # IP que mediasoup anuncia como candidato ICE (obligatoria en Docker bridge / VPS con NAT).
      BTALK_ANNOUNCED_IP: ${BTALK_ANNOUNCED_IP:-}
      CONCERT_MODE: ${CONCERT_MODE:-true}
      MAX_LIVE_MICS: ${MAX_LIVE_MICS:-2}
      MAX_PREPARED_MICS: ${MAX_PREPARED_MICS:-2}
      CONCERT_AUDIO_PROFILE: ${CONCERT_AUDIO_PROFILE:-SING}
      CONCERT_NOISE_REDUCTION: ${CONCERT_NOISE_REDUCTION:-LIGHT}
      AEC_ENABLED: ${AEC_ENABLED:-true}
      REFERENCE_AUDIO_MODE: ${REFERENCE_AUDIO_MODE:-MIXER}
      # Secretos: solo en .env.
      CONCERT_DJ_TOKEN: ${CONCERT_DJ_TOKEN:-}
      CONCERT_ADMIN_TOKEN: ${CONCERT_ADMIN_TOKEN:-}
      # Bingo Hit Live
      LIVE_HOST_TOKEN: ${LIVE_HOST_TOKEN:-}
      STUN_SERVER_URL: ${STUN_SERVER_URL:-}
      TURN_SERVER_URL: ${TURN_SERVER_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Plataforma Bingo Hit
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_DATA_FILE: /srv/server/data/platform.json
      PUBLIC_URL: ${PUBLIC_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-}
      MOCK_PAYMENTS: ${MOCK_PAYMENTS:-true}
      TRANSBANK_COMMERCE_CODE: ${TRANSBANK_COMMERCE_CODE:-}
      TRANSBANK_API_KEY: ${TRANSBANK_API_KEY:-}
      TRANSBANK_ENV: ${TRANSBANK_ENV:-integration}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
    volumes:
      # Volumen con nombre: conserva el propietario del contenedor (usuario "concert"); un bind mount
      # creado por root impediría escribir platform.json y el servidor se reiniciaría en bucle.
      - platform_data:/srv/server/data
    ports:
      # Solo accesible desde el propio servidor: Caddy o tu proxy inverso lo exponen en /sistema/.
      - "127.0.0.1:${CONCERT_PORT:-3010}:3010/tcp"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    # En Linux se puede sustituir el bloque ports por network_mode: host (mediasoup ve las NIC reales).

  dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 8888
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"

volumes:
  platform_data:
  caddy_data:
  caddy_config:
  dev_node_modules:
