# Si el servidor ya tiene nginx sirviendo www.paolosaxton.com, añade esto dentro de su
# bloque "server { ... }" (el de HTTPS) y arranca la app con el perfil por defecto:
#     docker compose up -d --build        # publica la app en 127.0.0.1:8080
#
# Con Apache el equivalente sería:
#     Redirect 301 /bingomusical /bingomusical/
#     ProxyPass        /bingomusical/ http://127.0.0.1:8080/
#     ProxyPassReverse /bingomusical/ http://127.0.0.1:8080/

location = /bingomusical {
    return 301 /bingomusical/;
}

location /bingomusical/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
