name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t music-bingo:ci .
      - name: Arrancar y comprobar que responde
        run: |
          docker run -d --rm --name bingo -p 8080:80 music-bingo:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Bingo Hit"; then echo OK; break; fi
            sleep 1
            [ "$i" = 20 ] && { docker logs bingo; exit 1; }
          done
          curl -fsS http://127.0.0.1:8080/js/main.js >/dev/null
          curl -fsS http://127.0.0.1:8080/cualquier/ruta | grep -q "Bingo Hit"
          docker stop bingo

  concert-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Instalar dependencias del servidor (mediasoup, socket.io)
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Prueba de humo de señalización + SFU
        working-directory: server
        run: npm test

  concert-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen del servidor Concert
        run: docker build -f server/Dockerfile -t music-bingo-concert:ci .
      - name: Arrancar y comprobar health y app
        run: |
          docker run -d --name concert -p 3010:3010 -e CONCERT_DJ_TOKEN=ci -e BTALK_ANNOUNCED_IP=127.0.0.1 -e MEDIASOUP_WORKERS=1 music-bingo-concert:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/health | grep -q '"concert":true'; then echo OK; break; fi
            sleep 1
            [ "$i" = 30 ] && { docker logs concert; docker inspect concert --format '{{.State.Status}} {{.State.ExitCode}}'; exit 1; }
          done
          docker logs concert
          curl -fsS http://127.0.0.1:3010/ | grep -q "Bingo Hit"
          curl -fsS http://127.0.0.1:3010/js/concert/views/dj.js >/dev/null
          curl -fsS http://127.0.0.1:3010/sfu/MediasoupClient.js | head -c 200 >/dev/null
          curl -fsS http://127.0.0.1:3010/socket.io/socket.io.esm.min.js | head -c 100 >/dev/null
          docker stop concert && docker rm concert
